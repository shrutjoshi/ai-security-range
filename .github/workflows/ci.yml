name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token: this job only reads the repo.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs; a moved tag cannot change what runs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy strict)
        run: mypy
      - name: Tests (pytest)
        run: pytest -q
      - name: SAST (bandit)
        run: bandit -q -r src -c pyproject.toml
      - name: Dependency audit (pip-audit, project dependencies only)
        run: pip-audit .
