name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy strict)
        run: mypy
      - name: Tests (pytest)
        run: pytest -q
      - name: SAST (bandit)
        run: bandit -q -r src -c pyproject.toml
      - name: Dependency audit (pip-audit)
        run: pip-audit || true
