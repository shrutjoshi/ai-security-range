[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-range"
version = "0.2.0"
description = "AI security training range: tested detection engines behind an interactive challenge front-end."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Shrutika Joshi" }]
keywords = ["ai-security", "prompt-injection", "mcp", "owasp-llm", "agent-security"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
live = ["anthropic>=0.39"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
ai-security-range = "ai_security_range.__main__:main"

[project.urls]
Homepage = "https://github.com/shrutjoshi/ai-security-range"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_security_range = ["static/*.html", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["ai_security_range"]
strict = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
